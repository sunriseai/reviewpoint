[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "reviewpoint"
version = "0.1.0"
description = "Risk guidelines, evidence-linked evaluation and explicit human decisions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
openai = ["openai>=2,<3"]

[project.scripts]
reviewpoint = "reviewpoint.cli:app"

[dependency-groups]
dev = ["pytest>=8.3,<9", "jsonschema>=4.23,<5", "mypy>=1.14,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/reviewpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/reviewpoint"]
plugins = ["pydantic.mypy"]
